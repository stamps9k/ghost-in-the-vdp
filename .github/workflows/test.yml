name: Build and test ROM

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build harness image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: harness
          push: false
          load: true
          tags: ghost-harness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        id: tests
        run: |
          mkdir -p out
          set +e
          docker run --rm -v "$PWD/out:/out" ghost-harness:ci
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Harness results"
            echo
            cat out/summary.md 2>/dev/null || echo "No summary produced."
            echo
            echo "Screenshots are attached as the **screenshots** artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out/

      - name: Fail on test failure
        if: steps.tests.outputs.status != '0'
        run: exit 1
